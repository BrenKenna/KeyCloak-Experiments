
networks:
  backend:
    driver: bridge


services:
  serverA:
    
    image: bkenna/simple-servers:latest
    
    container_name: serverA
    
    ports:
      - "8081:80"
    
    command:
      - ./simple-servers
      - --server
      - "server-A"
      - --host
      - "0.0.0.0"
      - --port
      - "80"

    networks:
      - backend


  serverB:
    
    image: bkenna/simple-servers:latest
    container_name: serverB
    
    ports:
      - "8082:80"

    command:
      - ./simple-servers
      - --server
      - "server-B"
      - --host
      - "0.0.0.0"
      - --port
      - "80"
    
    networks:
      - backend


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    
    ports:
      - "8093:8080"

    networks:
      - backend

    command:
      - start-dev
      - --hostname=http://localhost:8093

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password